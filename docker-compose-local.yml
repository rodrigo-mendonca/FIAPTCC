services:
  # Vector Database
  chromadb:
    build:
      context: ./fiap_chromadb
      dockerfile: Dockerfile
    container_name: chromadb
    ports:
      - "8210:8210"
    volumes:
      - ./data:/chroma/data
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_PORT=8210
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["http://localhost:3000","http://host.docker.internal:8001"]
    restart: unless-stopped
    networks:
      - fiap-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8210"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # SQL Database
  postgres:
    container_name: postgresql
    image: postgres:15
    command: ["postgres", "-c", "max_connections=1000"]
    restart: always
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mcpdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fiap-network

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "4000:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=mcp@mail.com
      - PGADMIN_DEFAULT_PASSWORD=postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - fiap-network

  mcp-postgres:
    image: acuvity/mcp-server-postgres:latest
    container_name: mcp-postgres
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URI=postgresql://postgres:postgres@postgres:5432/cnpj_dados_abertos?options=-csearch_path%3Dpublic
    depends_on:
      - postgres
    networks:
      - fiap-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  fiap-network:
    driver: bridge