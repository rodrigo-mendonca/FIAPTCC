services:
  # API
  fiap-api:
    build:
      context: .
      dockerfile: ./fiap_api/Dockerfile
    container_name: fiap-api
    ports:
      - "8001:8001"
    environment:
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8210
      - ENVIRONMENT=docker
      # ========== CORS ========== 
      - CORS_ORIGINS=http://localhost:3000,http://host.docker.internal:8001,http://host.docker.internal:8080
      - CHROMADB_DEFAULT_RESULTS=10

      # ========== GENAI ==========
      - GENAI_PROVIDER=${GENAI_PROVIDER:-lmstudio}
      - GENAI_ENDPOINT=${GENAI_ENDPOINT}
      - GENAI_MODEL=${GENAI_MODEL}
      - GENAI_API_KEY=${GENAI_API_KEY:-}
      - GENAI_API_VERSION=${GENAI_API_VERSION:-}
      - GENAI_TEMPERATURE=${GENAI_TEMPERATURE:-0.7}
      - GENAI_MAX_TOKENS=${GENAI_MAX_TOKENS:-8192}
      - GENAI_TOP_P=${GENAI_TOP_P:-0.95}

      # ========== EMBEDDINGS ==========
      - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER}
      - EMBEDDINGS_ENDPOINT=${EMBEDDINGS_ENDPOINT}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL}
      - EMBEDDINGS_API_KEY=${EMBEDDINGS_API_KEY:-}
      - EMBEDDINGS_API_VERSION=${EMBEDDINGS_API_VERSION:-}

      # ========== POSTGRESQL ==========
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cnpj_dados_abertos}

      # ========== MCP ==========
      - MCP_POSTGRES_URL=http://mcp-postgres:8000/mcp

    restart: unless-stopped
    networks:
      - fiap-network
    depends_on:
      - chromadb
      - postgres  # Add dependency on sqldb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  fiap-interface:
    build:
      context: ./fiap_interface
      dockerfile: Dockerfile
      args:
        - API_URL=http://host.docker.internal:8001
    container_name: fiap-interface
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - API_URL=http://host.docker.internal:8001
    depends_on:
      - fiap-api
    restart: unless-stopped
    networks:
      - fiap-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Vector Database
  chromadb:
    build:
      context: ./fiap_chromadb
      dockerfile: Dockerfile
    container_name: chromadb
    # Acesso somente interno (rede fiap-network) — sem porta publicada no host
    expose:
      - "8210"
    volumes:
      - chromadb_data:/chroma/data
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_PORT=8210
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["http://localhost:3000","http://host.docker.internal:8001"]
    restart: unless-stopped
    networks:
      - fiap-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8210"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # SQL Database
  postgres:
    container_name: postgresql
    image: postgres:15
    command: ["postgres", "-c", "max_connections=1000"]
    restart: always
    # Acesso somente interno (rede fiap-network) — sem porta publicada no host
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-cnpj_dados_abertos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    #  - ./tests/receita:/docker-entrypoint-initdb.d:ro
    networks:
      - fiap-network

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "4000:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-mcp@mail.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-postgres}
      - PGADMIN_REPLACE_SERVERS_ON_STARTUP=True
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
      - PGADMIN_SERVER_JSON_FILE=/tmp/servers.json
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-cnpj_dados_abertos}
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /tmp/pgpass <<EOF
        postgres:5432:$${POSTGRES_DB}:$${POSTGRES_USER}:$${POSTGRES_PASSWORD}
        EOF
        chmod 600 /tmp/pgpass

        cat > /tmp/servers.json <<EOF
        {
          "Servers": {
            "1": {
              "Name": "contacomigo.ai",
              "Group": "Servers",
              "Host": "postgres",
              "Port": 5432,
              "MaintenanceDB": "$${POSTGRES_DB}",
              "Username": "$${POSTGRES_USER}",
              "SSLMode": "prefer",
              "ConnectionParameters": {
                "sslmode": "prefer",
                "passfile": "/tmp/pgpass"
              }
            }
          }
        }
        EOF
        exec /entrypoint.sh
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - fiap-network

  mcp-postgres:
    image: acuvity/mcp-server-postgres:latest
    container_name: mcp-postgres
    # Acesso somente interno (rede fiap-network) — sem porta publicada no host
    expose:
      - "8000"
    environment:
      - DATABASE_URI=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cnpj_dados_abertos}?options=-csearch_path%3Dpublic
    depends_on:
      - postgres
    networks:
      - fiap-network

volumes:
  chromadb_data:
  postgres_data:
  pgadmin_data:

networks:
  fiap-network:
    driver: bridge
