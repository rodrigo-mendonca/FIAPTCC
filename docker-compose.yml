services:
  # API
  fiap-api:
    build:
      context: .
      dockerfile: ./fiap_api/Dockerfile
    container_name: fiap-api
    ports:
      - "8001:8001"
    env_file:
      - ./fiap_api/.env
    environment:
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8210
      - ENVIRONMENT=docker
      # ========== CORS ========== 
      - CORS_ORIGINS=http://localhost:3000,http://host.docker.internal:8001,http://host.docker.internal:8080
      - CHROMADB_DEFAULT_RESULTS=10

      # ========== GENAI ==========
      - GENAI_PROVIDER=lmstudio
      - GENAI_ENDPOINT=https://ai.mendonca.casa/
      - GENAI_MODEL=qwen/qwen3.5-9b
      - GENAI_API_KEY=${GENAI_API_KEY}
      - GENAI_API_VERSION=
      - GENAI_TEMPERATURE=0.7
      - GENAI_MAX_TOKENS=8192
      - GENAI_TOP_P=0.95

      # ========== EMBEDDINGS ==========
      - EMBEDDINGS_PROVIDER=jina
      - EMBEDDINGS_ENDPOINT=https://api.jina.ai
      - EMBEDDINGS_MODEL=jina-embeddings-v5-text-small
      - EMBEDDINGS_API_KEY=${EMBEDDINGS_API_KEY}
      - EMBEDDINGS_API_VERSION=

      # ========== POSTGRESQL ==========
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/cnpj_dados_abertos

      # ========== MCP ==========
      - MCP_POSTGRES_URL=http://mcp-postgres:8000/mcp

    restart: unless-stopped
    networks:
      - fiap-network
    depends_on:
      - chromadb
      - postgres  # Add dependency on sqldb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  fiap-interface:
    build:
      context: ./fiap_interface
      dockerfile: Dockerfile
      args:
        - API_URL=http://host.docker.internal:8001
    container_name: fiap-interface
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - API_URL=http://host.docker.internal:8001
    depends_on:
      - fiap-api
    restart: unless-stopped
    networks:
      - fiap-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Vector Database
  chromadb:
    build:
      context: ./fiap_chromadb
      dockerfile: Dockerfile
    container_name: chromadb
    # Acesso somente interno (rede fiap-network) — sem porta publicada no host
    expose:
      - "8210"
    volumes:
      - /DATA/AppData/TCC/chromadb:/chroma/data
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_PORT=8210
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["http://localhost:3000","http://host.docker.internal:8001"]
    restart: unless-stopped
    networks:
      - fiap-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8210"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # SQL Database
  postgres:
    container_name: postgresql
    image: postgres:15
    command: ["postgres", "-c", "max_connections=1000"]
    restart: always
    # Acesso somente interno (rede fiap-network) — sem porta publicada no host
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cnpj_dados_abertos
    volumes:
      - /DATA/AppData/TCC/postgres:/var/lib/postgresql/data
    networks:
      - fiap-network

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "4000:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=mcp@mail.com
      - PGADMIN_DEFAULT_PASSWORD=postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - fiap-network

  mcp-postgres:
    image: acuvity/mcp-server-postgres:latest
    container_name: mcp-postgres
    # Acesso somente interno (rede fiap-network) — sem porta publicada no host
    expose:
      - "8000"
    environment:
      - DATABASE_URI=postgresql://postgres:postgres@postgres:5432/cnpj_dados_abertos
    depends_on:
      - postgres
    networks:
      - fiap-network

volumes:
  pgadmin_data:

networks:
  fiap-network:
    driver: bridge