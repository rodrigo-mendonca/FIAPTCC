  # API
  fiap-api:
    build:
      context: .
      dockerfile: ./fiap_api/Dockerfile
    container_name: lmstudio-fiap-api
    ports:
      - "8001:8001"
    volumes:
      - ./fiap_api:/app
    env_file:
      - ./fiap_api/.env
    environment:
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8200
      - ENVIRONMENT=docker
      # ========== CORS ==========
      - CORS_ORIGINS=http://localhost:3000,http://host.docker.internal:8001,http://host.docker.internal:8080
      - CHROMADB_DEFAULT_RESULTS=150

      # ========== GENAI ==========
      - GENAI_PROVIDER=lmstudio
      - GENAI_ENDPOINT=http://host.docker.internal:1234/v1
      - GENAI_MODEL=openai/gpt-oss-20b
      - GENAI_API_KEY=lm-studio
      - GENAI_API_VERSION=
      - GENAI_TEMPERATURE=0.7
      - GENAI_MAX_TOKENS=8192
      - GENAI_TOP_P=0.95

      # ========== EMBEDDINGS ==========
      - EMBEDDINGS_PROVIDER=lmstudio
      - EMBEDDINGS_ENDPOINT=http://host.docker.internal:1234/v1
      - EMBEDDINGS_MODEL=text-embedding-nomic-embed-text-v1.5
      - EMBEDDINGS_API_KEY=lm-studio
      - EMBEDDINGS_API_VERSION=
    restart: unless-stopped
    networks:
      - lmstudio-network
    depends_on:
      - chromadb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  fiap-interface:
    build:
      context: ./fiap_interface
      dockerfile: Dockerfile
      args:
        - API_URL=http://host.docker.internal:8001
    container_name: lmstudio-fiap-interface
    ports:
      - "3000:3000"
    volumes:
      - ./fiap_interface:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - API_URL=http://host.docker.internal:8001
    depends_on:
      - fiap-api
    restart: unless-stopped
    networks:
      - lmstudio-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Vector Database
  chromadb:
    build:
      context: ./fiap_chromadb
      dockerfile: Dockerfile
    container_name: lmstudio-chromadb
    ports:
      - "8200:8200"
    volumes:
      - ./data:/chroma/data
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_PORT=8200
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["http://localhost:3000","http://host.docker.internal:8001"]
    restart: unless-stopped
    networks:
      - lmstudio-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  lmstudio-network:
    driver: bridge