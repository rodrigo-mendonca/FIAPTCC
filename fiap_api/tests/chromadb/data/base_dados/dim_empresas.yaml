tabela: dim_empresas
descricao: Identidade estável da empresa. Uma linha por CNPJ, mantendo o identificador
  interno único e estável ao longo do tempo.
contexto_negocio: 'Esta tabela representa a identidade única e estável da empresa.

  Existe uma única linha por CNPJ, com um identificador interno que nunca muda.

  A mesma empresa deve ter sempre o mesmo id.

  O histórico mensal da carga dos dados da receita NÃO fica nesta tabela, e sim em
  dim_empresas_mensal e fat_empresas_mensal.

  '
