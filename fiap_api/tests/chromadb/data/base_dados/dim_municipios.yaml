tabela: dim_municipios
descricao: Localização da empresa. Município, UF e indicação se é capital, usado para
  análises regionais (estado, cidade, capital x interior).
contexto_negocio: 'Esta tabela representa a localização (município) da empresa.

  Cada linha contém o código IBGE, o nome do município, a UF e a indicação se é capital.

  É usada para análises regionais por cidade, estado e capital x interior.

  '
colunas_importantes:
- nome: id
  tipo: integer
  nulo: false
  descricao: Identificador interno do município, chave primária
- nome: codigo
  tipo: varchar
  nulo: false
  descricao: Código do município
- nome: nome
  tipo: varchar
  nulo: false
  descricao: Nome do município
- nome: uf
  tipo: char
  nulo: false
  descricao: Estado (sigla da UF)
- nome: capital
  tipo: boolean
  nulo: false
  descricao: Indica se o município é capital
relacionamentos:
- tabela_referencia: dim_empresas_mensal
  descricao: Um município é referenciado por múltiplos snapshots de empresas
semantica: 'Cidade/município -> dim_municipios.nome. Estado/UF -> dim_municipios.uf.
  Interior -> dim_municipios.capital = false. Capital -> dim_municipios.capital = true.'
