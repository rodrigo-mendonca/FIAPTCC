tabela: dim_competencias
descricao: Calendário mensal da base. Representa o mês de referência dos dados no
  formato AAAAMM onde AAAA é o ano e MM é o mês correspondente.
contexto_negocio: 'Esta tabela representa o mês e ano de referencia (competência) dos dados.

  Cada linha corresponde a uma competência mensal.

  É utilizada como dimensão de tempo para análises de séries históricas, comparações
  YoY e por trimestre.

  O campo atualizado indica se a competência já foi carregada/processada.

  '
colunas_importantes:
- nome: id
  tipo: integer
  nulo: false
  descricao: Identificador interno da competência, chave primária
- nome: competencia
  tipo: integer
  nulo: false
  descricao: Indica Mês e Ano de referência no formato AAAAMM onde AAAA é o ano e MM é o mês
- nome: atualizado
  tipo: boolean
  nulo: false
  descricao: Indica se a competência foi carregada/processada
relacionamentos:
- tabela_referencia: dim_empresas_mensal
  descricao: Uma competência tem múltiplos snapshots mensais de empresas
- tabela_referencia: fat_empresas_mensal
  descricao: Uma competência tem múltiplos eventos mensais de empresas
semantica: Mês, Competência, Período. Ex. Maio de 2026 no formato AAAAMM ou 202605 -> dim_competencias.competencia
  = 202605.
