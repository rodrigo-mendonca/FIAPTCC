tabela: dim_empresas_mensal
descricao: Retrato mensal (snapshot) da empresa. Uma linha por CNPJ por competência,
  com dados cadastrais, porte, situação, Simples e MEI.
contexto_negocio: 'Esta tabela representa o estado (snapshot) da empresa em cada competência.

  Existe uma linha por CNPJ por competência mensal.

  Contém os dados cadastrais vigentes no mês, como razão social, nome fantasia, porte
  e situação cadastral, além das FKs para empresa, CNAE, município e competência.

  Use dim_empresas_mensal para contar estoque/base em uma competência.

  Use fat_empresas_mensal para contar eventos do mês.

  '
colunas_importantes:
- nome: id
  tipo: integer
  nulo: false
  descricao: Identificador interno do snapshot, chave primária
- nome: cnpj
  tipo: varchar
  nulo: false
  descricao: CNPJ completo no snapshot, sem máscara
- nome: razao_social
  tipo: varchar
  nulo: true
  descricao: Razão social da empresa
- nome: nome_fantasia
  tipo: varchar
  nulo: true
  descricao: Nome fantasia da empresa
- nome: porte
  tipo: integer
  nulo: true
  descricao: Código de porte da empresa
- nome: situacao
  tipo: integer
  nulo: true
  descricao: Código da situação cadastral
- nome: id_dim_empresa
  tipo: integer
  nulo: false
  descricao: FK da empresa estável (dim_empresas)
- nome: id_dim_cnae
  tipo: integer
  nulo: true
  descricao: FK do CNAE principal (dim_cnaes)
- nome: id_dim_municipio
  tipo: integer
  nulo: true
  descricao: FK do município (dim_municipios)
- nome: id_dim_competencia
  tipo: integer
  nulo: false
  descricao: FK da competência mensal (dim_competencias)
- nome: simples
  tipo: boolean
  nulo: true
  descricao: Indica se a empresa está no Simples
- nome: mei
  tipo: boolean
  nulo: true
  descricao: Indica se a empresa é MEI
relacionamentos:
- tabela_referencia: dim_empresas
  descricao: Cada snapshot pertence a uma empresa estável
- tabela_referencia: dim_competencias
  descricao: Cada snapshot pertence a uma competência mensal
- tabela_referencia: dim_cnaes
  descricao: Cada snapshot referencia o CNAE principal da empresa
- tabela_referencia: dim_municipios
  descricao: Cada snapshot referencia o município da empresa
semantica: Empresas ativas em um mês, empresas por cidade, empresas por CNAE, empresas
  MEI, empresas do Simples, situação atual da competência. Use para concentração/estoque.
